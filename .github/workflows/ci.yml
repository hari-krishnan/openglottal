# Tests on push/PR. (Ruff is not enforced here yet — run `ruff check .` locally; many scripts need cleanup.)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" "PyQt5>=5.15"

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
